<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Todo App</title>
</head>
<body>
    <main class="container">
        <section class="todo-card" aria-labelledby="page-title">
            <header class="app-header">
                <div>
                    <p class="eyebrow">YOUR DAY, ORGANIZED</p>
                    <h1 id="page-title">Todo App</h1>
                </div>
                <button type="button" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">🌙 Dark</button>
            </header>
            <form id="todo-form">
                <label class="sr-only" for="todo-input">Task name</label>
                <input type="text" id="todo-input" placeholder="What needs to get done?" maxlength="200" required>
                <div class="form-options">
                    <label>
                        <span>Category</span>
                        <input type="text" id="todo-category" list="category-options" maxlength="40" value="Personal" placeholder="e.g. Work">
                        <datalist id="category-options">
                            <option value="Personal"></option>
                            <option value="Work"></option>
                            <option value="Shopping"></option>
                            <option value="Health"></option>
                        </datalist>
                    </label>
                    <label>
                        <span>Priority</span>
                        <select id="todo-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                    <label>
                        <span>Due date</span>
                        <input type="date" id="todo-due-date">
                    </label>
                    <button type="submit" id="add-btn">Add task</button>
                </div>
            </form>
            <p id="error-message" role="status" aria-live="polite"></p>
            <label class="search-box">
                <span class="sr-only">Search tasks</span>
                <span aria-hidden="true">⌕</span>
                <input type="search" id="search-input" placeholder="Search tasks or categories...">
            </label>
            <div class="todo-toolbar">
                <div class="filters" role="group" aria-label="Filter tasks by status">
                    <button type="button" class="filter-btn selected" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
                </div>
                <label class="category-filter">
                    <span class="sr-only">Filter by category</span>
                    <select id="category-filter">
                        <option value="all">All categories</option>
                    </select>
                </label>
            </div>
            <ul id="todo-list" aria-label="Todo tasks"></ul>
            <p id="empty-state">No tasks yet. Add one above to get started.</p>
            <footer class="todo-footer">
                <span id="remaining-count">0 tasks remaining</span>
                <button type="button" id="clear-completed">Clear completed</button>
            </footer>
        </section>
    </main>

    <script src="todo.js"></script>
</body>
</html>
